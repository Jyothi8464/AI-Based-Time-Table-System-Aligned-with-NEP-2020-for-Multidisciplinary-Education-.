<!DOCTYPE html>
<html>
<head>
    <title>User Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4a90e2, #50e3c2);
        }

        .login-container {
            background: #fff;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            width: 400px;
            position: relative;
            overflow: hidden;
        }

        /* Animated glowing effect */
        .login-container::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 6s linear infinite;
            z-index: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h2 {
            text-align: center;
            margin-bottom: 35px;
            color: #333;
            font-size: 28px;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        form {
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        label {
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"], input[type="password"] {
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #4a90e2;
            outline: none;
            box-shadow: 0 0 8px rgba(74,144,226,0.5);
        }

        input[type="submit"] {
            padding: 12px;
            background: linear-gradient(45deg, #ff6b6b, #ff4757);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255,107,107,0.3);
        }

        input[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255,107,107,0.5);
        }

        .message {
            text-align: center;
            margin-bottom: 15px;
            color: #ff4d4d;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .signup-link {
            text-align: center;
            margin-top: 15px;
            position: relative;
            z-index: 1;
        }

        .signup-link a {
            color: #4a90e2;
            font-weight: 500;
            text-decoration: none;
            transition: 0.3s;
        }

        .signup-link a:hover {
            text-decoration: underline;
            color: #357ab7;
        }

        /* Responsive */
        @media(max-width: 450px) {
            .login-container {
                width: 90%;
                padding: 40px 30px;
            }

            h2 {
                font-size: 24px;
            }

            input[type="submit"] {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>User Login</h2>

        {% if msg %}
            <p class="message">{{ msg }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label>Username:</label>
            <input type="text" name="t1" placeholder="Enter your username" required>

            <label>Password:</label>
            <input type="password" name="t2" placeholder="Enter your password" required>

            <input type="submit" value="Login">
        </form>

        <div class="signup-link">
            <p>New user? <a href="{% url 'signup' %}">Signup here</a></p>
        </div>
    </div>
</body>
</html>
