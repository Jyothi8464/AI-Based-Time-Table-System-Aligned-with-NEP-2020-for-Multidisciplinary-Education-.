<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Time Table Generator</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #4a90e2, #50e3c2);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Animated background shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            animation: float 8s ease-in-out infinite;
        }

        .shape1 { width: 300px; height: 300px; background: #ff6b6b; top: -50px; left: -50px; }
        .shape2 { width: 250px; height: 250px; background: #1dd1a1; bottom: -60px; right: -60px; }
        .shape3 { width: 200px; height: 200px; background: #feca57; top: 100px; right: -100px; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg);}
            50% { transform: translateY(20px) rotate(20deg);}
        }

        /* Main container */
        .container {
            position: relative;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 60px 50px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        .container h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #333;
            font-weight: 700;
        }

        .container p {
            font-size: 16px;
            margin-bottom: 40px;
            color: #555;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 14px 35px;
            margin: 10px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .btn-login {
            background: linear-gradient(45deg, #ff6b6b, #ff4757);
        }

        .btn-login:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(255,107,107,0.4);
        }

        .btn-signup {
            background: linear-gradient(45deg, #1dd1a1, #10ac84);
        }

        .btn-signup:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(29,209,161,0.4);
        }

        /* Realistic floating shadow */
        .btn:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Responsive */
        @media(max-width: 600px){
            .container {
                padding: 40px 30px;
            }
            .container h1 { font-size: 28px; }
            .btn { font-size: 16px; padding: 12px 30px; }
        }

    </style>
</head>
<body>

    <!-- Background Shapes -->
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>

    <!-- Main Hero Container -->
    <div class="container">
        <h1>AI Based Time Table Generator</h1>
        <p>Create optimized, conflict-free timetables in real-time using AI.</p>
        <a href="{% url 'login' %}" class="btn btn-login">Login</a>
        <a href="{% url 'signup' %}" class="btn btn-signup">Signup</a>
    </div>

</body>
</html>
